{% extends "base.html" %}

{% block title %}Change Password - PG Hostel Mess{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-custom p-4 p-md-5 border-0 shadow">
        <h4 class="fw-bold text-primary mb-3"><i class="fa-solid fa-key me-2"></i> Change Password</h4>
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Current Password</label>
            <input type="password" name="old_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" name="new_password" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold shadow"><i class="fa-solid fa-check me-2"></i> Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
