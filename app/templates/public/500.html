{% extends "base.html" %}

{% block title %}500 Internal Error - {{ hostel_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="card shadow-lg border-0 rounded-4 p-5 mx-auto" style="max-width: 600px;">
        <div class="mb-4">
            <span class="bg-danger-subtle text-danger p-4 rounded-circle display-4 d-inline-flex align-items-center justify-content-center" style="width: 100px; height: 100px;">
                <i class="fas fa-triangle-exclamation"></i>
            </span>
        </div>
        <h2 class="fw-bold text-dark mb-2">500 Server Initializing</h2>
        <p class="text-secondary mb-4">The server is connecting to database services. Please refresh in a few seconds.</p>
        <div>
            <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg rounded-pill px-4 me-2">
                <i class="fas fa-home me-2"></i>Go to Home
            </a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                <i class="fas fa-right-to-bracket me-2"></i>Login Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
